version: 2

updates:
  # One grouped pull request a week rather than a stream of single-package ones.
  # A dozen open dependency PRs is a queue nobody reads, which is how a security
  # update ends up sitting unmerged behind a formatter bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors change behaviour and are read one at a time, not batched.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Majors change behaviour and are read one at a time, not batched. The npm
      # section already says this; leaving it off here let a Node 22 to 26 bump
      # arrive as a routine update.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

name: end-to-end

# The browser suite, when you ask for it.
#
# It ran on every pull request and was the most expensive thing in the repo:
# a Playwright image to pull, a second Postgres, a second `pnpm build` and an
# object store downloaded from the internet, for forty tests that finish in
# under thirty seconds. `pnpm test:e2e` runs the same suite locally against the
# compose stack, which is where it gets used in practice.
#
# Run it from the Actions tab before a release, or on a branch you want the full
# journey checked on.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch or tag to run it against
        required: false
        default: main

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22

jobs:
  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Playwright's own image, pinned to the version in package.json. It ships the
    # browsers and their system libraries already installed, which removes the
    # `playwright install --with-deps` step — that step was apt-installing
    # libraries on every run and took 441 of the job's 475 seconds, to run four
    # tests that finish in five.
    #
    # Keep this tag in step with @playwright/test when it is upgraded; a
    # mismatch makes Playwright refuse to use the bundled browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    # The suite drives the real product, so it needs what the product needs.
    # Reached by service name rather than through localhost: the job runs inside
    # a container on the same network as these.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lpm
          POSTGRES_PASSWORD: lpm
          POSTGRES_DB: lpm_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://lpm:lpm@postgres:5432/lpm_test
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: lpm-e2e
      S3_ACCESS_KEY: lpm
      S3_SECRET_KEY: lpm-dev-secret

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Pinned to a commit, like every action GitHub does not own. release.yml says why.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MinIO rather than a mock, because it is what the compose stack runs and
      # what a studio will deploy. Started from its binary rather than as a
      # service container: a service container takes no command, and MinIO
      # without `server <path>` prints its help and exits.
      - name: Start an object store
        env:
          MINIO_ROOT_USER: lpm
          MINIO_ROOT_PASSWORD: lpm-dev-secret
        run: |
          curl -sSLo /usr/local/bin/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /usr/local/bin/minio
          nohup minio server /tmp/minio --address :9000 --quiet > /tmp/minio.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'the object store never became ready:' >&2
          cat /tmp/minio.log >&2
          exit 1

      # Playwright runs against the production build, so this has to happen
      # first — including the generated token stylesheet. `pnpm test:e2e` builds
      # too, but as its own step a build failure reads as one.
      - run: pnpm build

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: .output/playwright-report/
          retention-days: 7
